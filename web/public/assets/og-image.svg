  <!-- headline -->
  <text x="90" y="320" font-size="62" font-weight="700" fill="#FFFFFF">Vos données restaurant,</text>
  <text x="90" y="392" font-size="62" font-weight="700" fill="#FFFFFF">chaque matin sur <tspan fill="#E8A13A">WhatsApp</tspan>.</text>

  <text x="90" y="462" font-size="27" fill="#D6F0E4">Rapport quotidien automatique + questions en langage naturel.</text>
