<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A24"/>
      <stop offset="1" stop-color="#157552"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og)"/>

  <!-- soft plate decoration -->
  <circle cx="1010" cy="315" r="240" fill="none" stroke="#FBF8F2" stroke-width="2" opacity="0.12"/>
  <circle cx="1010" cy="315" r="180" fill="none" stroke="#FBF8F2" stroke-width="2" opacity="0.10"/>

  <!-- mark -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#1E9E6A"/>
