<svg width="560" height="440" viewBox="0 0 560 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Set de table vue de dessus">
  <!-- set de table (napperon) -->
  <rect x="70" y="70" width="420" height="300" rx="26" fill="#F1EBDD"/>
  <rect x="70" y="70" width="420" height="300" rx="26" fill="none" stroke="#DFD4BB" stroke-width="2"/>

  <!-- assiette -->
  <circle cx="280" cy="220" r="120" fill="#FBF8F1"/>
  <circle cx="280" cy="220" r="120" fill="none" stroke="#E6DCC7" stroke-width="2"/>
  <circle cx="280" cy="220" r="94" fill="#FDFCF8"/>
  <circle cx="280" cy="220" r="94" fill="none" stroke="#1F6E4C" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="280" cy="220" r="70" fill="#F6F1E6"/>

  <!-- serviette pliee -->
  <rect x="238" y="196" width="84" height="48" rx="6" fill="#E7EFE6"/>
  <rect x="238" y="196" width="84" height="48" rx="6" fill="none" stroke="#C7DAC5" stroke-width="2"/>
  <line x1="238" y1="212" x2="322" y2="212" stroke="#C7DAC5" stroke-width="2"/>
  <line x1="238" y1="228" x2="322" y2="228" stroke="#C7DAC5" stroke-width="2"/>

  <!-- fourchette a gauche -->
  <g stroke="#1F6E4C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="132" y1="150" x2="132" y2="184"/>
    <line x1="146" y1="150" x2="146" y2="184"/>
    <line x1="160" y1="150" x2="160" y2="184"/>
    <path d="M132 184 q0 16 14 18 q14 -2 14 -18"/>
    <line x1="146" y1="202" x2="146" y2="300"/>
  </g>

  <!-- couteau a droite -->
  <g stroke="#1F6E4C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M414 150 q10 4 10 34 l0 20 q-10 4 -10 -4 Z" fill="#1F6E4C" fill-opacity="0.1"/>
    <line x1="414" y1="150" x2="414" y2="204"/>
    <line x1="414" y1="204" x2="414" y2="300"/>
  </g>

  <!-- verre a vin en haut a droite -->
  <g stroke="#1F6E4C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <path d="M446 108 q-16 0 -16 26 q0 22 16 26 q16 -4 16 -26 q0 -26 -16 -26 Z" fill="#8FB79A" fill-opacity="0.25"/>
    <line x1="446" y1="160" x2="446" y2="192"/>
    <line x1="430" y1="192" x2="462" y2="192"/>
  </g>
</svg>
